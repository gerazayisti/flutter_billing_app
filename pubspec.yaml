name: billing_app
description: Plateforme de gestion de caise et boutique en ligne.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & DI
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5
  
  # Functional Programming
  fpdart: ^1.1.0
  
  # Code Generation Annotations
  json_annotation: ^4.9.0
  
  # Navigation
  go_router: ^14.0.0
  
  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Cryptography (PIN hashing)
  crypto: ^3.0.3

  # HTTP client (Mobile Money API)
  http: ^1.2.0

  # Cloud sync (Supabase)
  supabase_flutter: ^2.5.0
  connectivity_plus: ^6.0.3

  # UI & Utilities
  google_fonts: ^6.1.0
  vibration: ^3.1.8
  intl: 0.20.2
  permission_handler: ^11.3.1
  fl_chart: ^0.69.2
  
  # Scanner & Printer
  pretty_qr_code: ^3.3.0
  print_bluetooth_thermal: ^1.1.2
  mobile_scanner: ^5.1.0
  bloc: ^8.1.4
  uuid: ^4.5.2
  app_settings: ^7.0.0
  
  # Share & PDF
  share_plus: ^10.1.3
  pdf: ^3.11.2
  printing: ^5.13.2
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
